<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="APEX: five red lights come on and go out, the logo slams in and three cars blast past">
  <!-- 10 s loop. 0-4.2 s: the five lights come on. 4.2 s: lights out, white flash, the frame shakes, the logo slams in
       and three cars blast past. 9.4 s: everything fades for the next start. Without animation (static renderers,
       reduced motion) it shows the end state: logo, tagline, lights dark. -->
  <defs>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="12" height="12" fill="#0C0C12"/><rect width="4" height="12" fill="#12121A"/>
    </pattern>
    <radialGradient id="bloom" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#E10600" stop-opacity=".6"/><stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/><stop offset=".75" stop-color="#E10600" stop-opacity=".8"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#15151E" stop-opacity="0"/><stop offset="1" stop-color="#15151E"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5 0"/></filter>
    <clipPath id="frame"><rect width="1200" height="480"/></clipPath>
    <!-- side-on F1 car, nose right, 170 x 38 -->
    <g id="car">
      <path d="M0 8 H14 V26 H0 Z" fill="#E10600"/>
      <path d="M12 26 L30 20 L56 18 L70 10 L88 9 L96 2 H104 L108 10 L132 14 L156 21 L170 25 V30 H12 Z" fill="#F5F7FA"/>
      <path d="M58 18 L74 12 L92 12 L100 18 Z" fill="#15151E"/>
      <path d="M150 27 H172 V32 H150 Z" fill="#E10600"/>
      <circle cx="34" cy="30" r="9" fill="#0A0A0E" stroke="#3A3A46" stroke-width="2"/>
      <circle cx="140" cy="30" r="9" fill="#0A0A0E" stroke="#3A3A46" stroke-width="2"/>
    </g>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

    /* the five lights: on one by one, then all out together at 42% (4.2 s) */
    .lamp { fill: #2A0B0B; animation: 10s infinite steps(1, end); }
    .halo { fill: #FF2A1A; fill-opacity: 0; filter: url(#glow); animation: 10s infinite steps(1, end); }
    .n0 { animation-name: on0; } .n1 { animation-name: on1; } .n2 { animation-name: on2; } .n3 { animation-name: on3; } .n4 { animation-name: on4; }
    .halo.n0 { animation-name: h0; } .halo.n1 { animation-name: h1; } .halo.n2 { animation-name: h2; } .halo.n3 { animation-name: h3; } .halo.n4 { animation-name: h4; }
    @keyframes on0 { 0% { fill: #2A0B0B } 6% { fill: #FF1E0F } 42% { fill: #2A0B0B } }
    @keyframes on1 { 0% { fill: #2A0B0B } 13% { fill: #FF1E0F } 42% { fill: #2A0B0B } }
    @keyframes on2 { 0% { fill: #2A0B0B } 20% { fill: #FF1E0F } 42% { fill: #2A0B0B } }
    @keyframes on3 { 0% { fill: #2A0B0B } 27% { fill: #FF1E0F } 42% { fill: #2A0B0B } }
    @keyframes on4 { 0% { fill: #2A0B0B } 34% { fill: #FF1E0F } 42% { fill: #2A0B0B } }
    @keyframes h0 { 0% { fill-opacity: 0 } 6% { fill-opacity: .9 } 42% { fill-opacity: 0 } }
    @keyframes h1 { 0% { fill-opacity: 0 } 13% { fill-opacity: .9 } 42% { fill-opacity: 0 } }
    @keyframes h2 { 0% { fill-opacity: 0 } 20% { fill-opacity: .9 } 42% { fill-opacity: 0 } }
    @keyframes h3 { 0% { fill-opacity: 0 } 27% { fill-opacity: .9 } 42% { fill-opacity: 0 } }
    @keyframes h4 { 0% { fill-opacity: 0 } 34% { fill-opacity: .9 } 42% { fill-opacity: 0 } }

    /* the red glow builds with each light, then the white flash at lights out */
    .bloom { animation: bloom 10s infinite; }
    @keyframes bloom { 0% { opacity: 0 } 34%, 41.9% { opacity: 1 } 42%, 100% { opacity: 0 } }
    .flash { opacity: 0; animation: flash 10s infinite; }
    @keyframes flash { 0%, 41.9% { opacity: 0 } 42% { opacity: .85 } 46%, 100% { opacity: 0 } }

    /* camera shake when they go */
    .shake { animation: shake 10s infinite; }
    @keyframes shake { 0%, 42% { transform: none } 42.5% { transform: translate(-9px, 5px) } 43% { transform: translate(8px, -6px) }
      43.5% { transform: translate(-6px, -3px) } 44% { transform: translate(5px, 4px) } 44.5% { transform: translate(-3px, 2px) }
      45% { transform: translate(2px, -1px) } 45.5%, 100% { transform: none } }

    /* logo slam: big, skewed and blurred, then snaps into place */
    .slam { transform-origin: 600px 236px; animation: slam 10s infinite cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes slam { 0%, 42% { opacity: 0; transform: scale(2.6) skewX(-24deg); filter: blur(10px) }
      45.5% { opacity: 1; transform: scale(.94) skewX(4deg); filter: blur(0) } 47.5%, 92% { opacity: 1; transform: none; filter: blur(0) }
      96%, 100% { opacity: 0; transform: translateX(80px) skewX(-18deg) } }
    .wipe { transform-box: fill-box; transform-origin: 0 50%; animation: wipe 10s infinite cubic-bezier(.7, 0, .2, 1); }
    @keyframes wipe { 0%, 45% { transform: scaleX(0) } 49%, 100% { transform: scaleX(1) } }
    .tag { animation: tag 10s infinite cubic-bezier(.2, .9, .3, 1); }
    @keyframes tag { 0%, 47% { opacity: 0; transform: translateX(-60px) } 51%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0; transform: translateX(60px) } }

    /* three cars blasting through after lights out */
    .car { transform: translateX(1500px); }
    .c0 { animation: blast 10s infinite cubic-bezier(.55, 0, .45, 1); }
    .c1 { animation: blast 10s .25s infinite cubic-bezier(.55, 0, .45, 1); }
    .c2 { animation: blast 10s .45s infinite cubic-bezier(.55, 0, .45, 1); }
    @keyframes blast { 0%, 42.5% { transform: translateX(-600px) } 55%, 100% { transform: translateX(1500px) } }

    /* always moving: speed streaks, the kerb, the ticker */
    .s { animation: fly linear infinite; }
    @keyframes fly { from { transform: translateX(1300px) } to { transform: translateX(-500px) } }
    .kerb { animation: kerb .5s linear infinite; }
    @keyframes kerb { to { transform: translateX(-48px) } }
    .ticker { transform-box: fill-box; animation: ticker 22s linear infinite; }  /* two copies: half its width loops seamlessly whatever the font */
    @keyframes ticker { to { transform: translateX(-50%) } }
    .live { animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .2 } }

    @media (prefers-reduced-motion: reduce) {
      *, .car { animation: none !important; }
      .car { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
  <g class="shake">
    <rect x="-20" y="-20" width="1240" height="520" fill="url(#carbon)"/>
    <rect class="bloom" width="1200" height="480" fill="url(#bloom)" style="opacity: 0"/>

    <!-- speed streaks -->
    <rect class="s" style="animation-duration:1.7s" y="150" width="280" height="2" fill="url(#streak)"/>
    <rect class="s" style="animation-duration:2.6s;animation-delay:-1s" y="300" width="400" height="2" fill="url(#streak)"/>
    <rect class="s" style="animation-duration:1.2s;animation-delay:-.4s" y="342" width="190" height="1.5" fill="url(#streak)"/>
    <rect class="s" style="animation-duration:3.1s;animation-delay:-2s" y="118" width="440" height="1" fill="url(#streak)"/>
    <rect class="s" style="animation-duration:2.1s;animation-delay:-1.6s" y="262" width="320" height="1.5" fill="url(#streak)"/>
    <rect class="s" style="animation-duration:1.5s;animation-delay:-.9s" y="206" width="230" height="1" fill="url(#streak)"/>

    <!-- start gantry -->
    <rect x="352" y="14" width="496" height="10" rx="2" fill="#22222C"/>
    <g transform="translate(377 20)">
      <g><rect width="70" height="104" rx="14" fill="#08080C" stroke="#33333F"/>
        <circle class="halo n0" cx="35" cy="30" r="26"/><circle class="halo n0" cx="35" cy="74" r="26"/>
        <circle class="lamp n0" cx="35" cy="30" r="17"/><circle class="lamp n0" cx="35" cy="74" r="17"/></g>
      <g transform="translate(94 0)"><rect width="70" height="104" rx="14" fill="#08080C" stroke="#33333F"/>
        <circle class="halo n1" cx="35" cy="30" r="26"/><circle class="halo n1" cx="35" cy="74" r="26"/>
        <circle class="lamp n1" cx="35" cy="30" r="17"/><circle class="lamp n1" cx="35" cy="74" r="17"/></g>
      <g transform="translate(188 0)"><rect width="70" height="104" rx="14" fill="#08080C" stroke="#33333F"/>
        <circle class="halo n2" cx="35" cy="30" r="26"/><circle class="halo n2" cx="35" cy="74" r="26"/>
        <circle class="lamp n2" cx="35" cy="30" r="17"/><circle class="lamp n2" cx="35" cy="74" r="17"/></g>
      <g transform="translate(282 0)"><rect width="70" height="104" rx="14" fill="#08080C" stroke="#33333F"/>
        <circle class="halo n3" cx="35" cy="30" r="26"/><circle class="halo n3" cx="35" cy="74" r="26"/>
        <circle class="lamp n3" cx="35" cy="30" r="17"/><circle class="lamp n3" cx="35" cy="74" r="17"/></g>
      <g transform="translate(376 0)"><rect width="70" height="104" rx="14" fill="#08080C" stroke="#33333F"/>
        <circle class="halo n4" cx="35" cy="30" r="26"/><circle class="halo n4" cx="35" cy="74" r="26"/>
        <circle class="lamp n4" cx="35" cy="30" r="17"/><circle class="lamp n4" cx="35" cy="74" r="17"/></g>
    </g>

    <!-- the logo (shared/brand/apex-wordmark.svg at 5x) -->
    <g class="slam">
      <g transform="translate(425 150) scale(5)">
        <path d="M1.4 9.2 L6.4 9.2 L5.65 10.7 L0.65 10.7 Z M1.15 12.4 L4.05 12.4 L3.3 13.9 L0.4 13.9 Z" fill="#E10600"/>
        <path d="M1.5 21 L11.3 3 L15.8 3 L19.5 21 L14.9 21 L12.5 9.25 L6.1 21 Z" fill="#FFFFFF"/>
        <g transform="translate(0 21) skewX(-9.6) translate(0 -21)" fill="none" stroke="#FFFFFF" stroke-width="4">
          <path d="M26 21 V5 H31 A4 4 0 0 1 31 13 H26"/>
          <path d="M48 5 H38 V19 H48 M38 12 H46"/>
          <path d="M53.3 4 L64.7 20 M64.7 4 L53.3 20"/>
        </g>
        <path class="wipe" d="M4.15 15.4 L21.4 12.05 L20.25 14.65 L3 18 Z" fill="#E10600"/>
      </g>
    </g>
    <g class="tag">
      <text x="600" y="316" text-anchor="middle" fill="#B4B4C0" font-size="17" font-weight="700" letter-spacing="7">F1 ON YOUR HOME SCREEN, LOCK SCREEN AND DESKTOP</text>
    </g>

    <!-- the cars -->
    <g transform="translate(0 330)">
      <g class="car c0"><rect x="-420" y="14" width="420" height="10" fill="url(#trail)" filter="url(#blur)"/><use href="#car" filter="url(#blur)"/></g>
      <g class="car c1" transform="translate(0 0)"><g transform="translate(0 0)"><rect x="-300" y="14" width="300" height="10" fill="url(#trail)" filter="url(#blur)"/><use href="#car" filter="url(#blur)" opacity=".85"/></g></g>
      <g class="car c2"><rect x="-260" y="14" width="260" height="10" fill="url(#trail)" filter="url(#blur)"/><use href="#car" filter="url(#blur)" opacity=".7"/></g>
    </g>

    <!-- kerb -->
    <rect y="372" width="1200" height="26" fill="url(#road)"/>
    <g class="kerb">
      <rect x="0" y="398" width="1260" height="10" fill="#F5F7FA"/>
      <path d="M0 398 h24 v10 h-24 Z M48 398 h24 v10 h-24 Z M96 398 h24 v10 h-24 Z M144 398 h24 v10 h-24 Z M192 398 h24 v10 h-24 Z M240 398 h24 v10 h-24 Z M288 398 h24 v10 h-24 Z M336 398 h24 v10 h-24 Z M384 398 h24 v10 h-24 Z M432 398 h24 v10 h-24 Z M480 398 h24 v10 h-24 Z M528 398 h24 v10 h-24 Z M576 398 h24 v10 h-24 Z M624 398 h24 v10 h-24 Z M672 398 h24 v10 h-24 Z M720 398 h24 v10 h-24 Z M768 398 h24 v10 h-24 Z M816 398 h24 v10 h-24 Z M864 398 h24 v10 h-24 Z M912 398 h24 v10 h-24 Z M960 398 h24 v10 h-24 Z M1008 398 h24 v10 h-24 Z M1056 398 h24 v10 h-24 Z M1104 398 h24 v10 h-24 Z M1152 398 h24 v10 h-24 Z M1200 398 h24 v10 h-24 Z M1248 398 h24 v10 h-24 Z" fill="#E10600"/>
    </g>

    <!-- ticker -->
    <rect y="408" width="1200" height="56" fill="#08080C"/>
    <rect y="408" width="132" height="56" fill="#E10600"/>
    <circle class="live" cx="24" cy="436" r="5" fill="#fff"/>
    <text x="38" y="442" fill="#fff" font-size="16" font-weight="900" letter-spacing="2">LIVE</text>
    <svg x="132" y="408" width="1068" height="56">
      <g class="ticker" font-size="15" font-weight="800" letter-spacing="1.5">
        <text y="34" fill="#F5F7FA" xml:space="preserve"><tspan fill="#6E6E7B">LAP 34/56</tspan>   ANT LEADER   <tspan fill="#2CD46B">HAM +1.150 ▲</tspan>   RUS +1.931   VER +3.388   <tspan fill="#B26CFF">LEC FASTEST LAP 1:36.112</tspan>   NOR <tspan fill="#E10600">PIT</tspan>   PIA +7.120   HAD +8.870   <tspan fill="#6E6E7B">·</tspan><tspan fill="#6E6E7B">LAP 34/56</tspan>   ANT LEADER   <tspan fill="#2CD46B">HAM +1.150 ▲</tspan>   RUS +1.931   VER +3.388   <tspan fill="#B26CFF">LEC FASTEST LAP 1:36.112</tspan>   NOR <tspan fill="#E10600">PIT</tspan>   PIA +7.120   HAD +8.870   <tspan fill="#6E6E7B">·</tspan></text>
      </g>
    </svg>
    <rect y="464" width="1200" height="16" fill="#E10600"/>

    <rect class="flash" width="1200" height="480" fill="#fff"/>
  </g>
  </g>
</svg>
