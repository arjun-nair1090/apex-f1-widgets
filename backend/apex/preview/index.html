<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX Widget Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2308090B'/%3E%3Cpath d='M4 21 L12 3.5 L20 21' fill='none' stroke='%23F5F7FA' stroke-width='3' stroke-linecap='square'/%3E%3Cpath d='M6.5 16 L21 12.5' fill='none' stroke='%23FF5A1F' stroke-width='2.25' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="widgets.css">
<style>
/* Tokens: shared/design-tokens/tokens.json */
:root {
  --bg: #0E0E14; --surface: #15151E; --elevated: #22222C; --border: #2D2D38;
  --t1: #FFFFFF; --t2: #A7A7B3; --t3: #6E6E7B;
  --signal: #E10600; --purple: #A879FF; --green: #2FD27F; --yellow: #E8C547;
  --sans: "Formula1 Display", "Titillium Web", "Segoe UI", sans-serif; --mono: var(--sans);
  --r-s: 4px; --r-m: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--t1); font: 500 14px/1.4 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---------- page chrome ---------- */
.bar { display: flex; align-items: center; gap: 24px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.bar svg { display: block; }
.bar .status { margin-left: auto; color: var(--t2); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.bar .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
.bar .status.bad i { background: var(--signal); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-m); padding: 2px; gap: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--t2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--elevated); color: var(--t1); box-shadow: inset 0 0 0 1px var(--border); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: calc(100vh - 65px); }
.stage { padding: 40px 40px 56px; overflow: hidden; }
.stage h1 { font: 600 13px/1 var(--sans); color: var(--t2); margin-bottom: 8px; }
.stage .hint { color: var(--t3); font-size: 13px; margin-bottom: 32px; max-width: 60ch; }
.sizes { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
.size-col { display: grid; gap: 12px; justify-items: start; }
.size-col > span { font-size: 12px; color: var(--t3); }
.lockrow { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; margin-top: 40px; padding: 24px; border-radius: 12px;
  background: radial-gradient(120% 140% at 20% 0%, #2a3140 0%, #12151b 55%, #07080a 100%); width: fit-content; max-width: 100%; }
.gallery-h { margin: 56px 0 16px; font: 600 13px/1 var(--sans); color: var(--t2); }
.gallery { display: flex; flex-wrap: wrap; gap: 24px; }
.gallery button { all: unset; cursor: pointer; display: grid; gap: 8px; }
.gallery button > span { font-size: 12px; color: var(--t3); }
.gallery button[aria-current="true"] > span { color: var(--t1); }
.gallery button:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; border-radius: 4px; }

.panel { border-left: 1px solid var(--border); background: var(--surface); padding: 24px; display: grid; gap: 24px; align-content: start; }
.field { display: grid; gap: 8px; }
.field > label, .field > .plbl { font-size: 12px; color: var(--t2); }
.field select { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-m); padding: 9px 12px; width: 100%; }
.field .seg { width: 100%; }
.field .seg button { flex: 1; padding: 6px 4px; }
.wlist { display: grid; gap: 2px; }
.wlist button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; color: var(--t2); }
.wlist button small { color: var(--t3); font-size: 12px; }
.wlist button[aria-pressed="true"] { background: var(--elevated); color: var(--t1); box-shadow: inset 2px 0 0 var(--signal); }
.wlist button:focus-visible { outline: 2px solid var(--signal); }
.toggle { display: flex; justify-content: space-between; align-items: center; }
.switch { width: 36px; height: 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--t3); transition: transform .16s ease-out, background .16s; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--t1); }
.note { color: var(--t3); font-size: 12px; line-height: 1.5; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .panel { border-left: 0; border-top: 1px solid var(--border); }
  .stage { padding: 24px 16px 40px; }
  .bar { flex-wrap: wrap; padding: 12px 16px; gap: 12px; }
  .size-col, .gallery button { width: 100%; grid-template-columns: minmax(0, 1fr); }
  .w.m, .w.l { max-width: 100%; }
}

/* lock screen (vibrant, monochrome) */
.lk { color: #fff; font-family: -apple-system, var(--sans); }
.lk-rect { width: 170px; height: 72px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.lk-rect .a { font: 600 12px/1.2 var(--sans); letter-spacing: .05em; opacity: .75; text-transform: uppercase; }
.lk-rect .b { font: 600 22px/1.1 var(--mono); letter-spacing: -.02em; }
.lk-rect .c { font: 500 12px/1.2 var(--mono); opacity: .75; }
.lk-circ { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-content: center; text-align: center; }
.lk-circ .a { font: 600 9px/1 var(--sans); letter-spacing: .08em; opacity: .75; }
.lk-circ .b { font: 600 18px/1.1 var(--mono); }
.lk-inline { font: 600 13px/1 var(--sans); opacity: .9; }
.lockrow[hidden] { display: none; }
.lk span.lbl, .lk span.plbl { display: block; font-size: 11px; color: rgba(255,255,255,.45); margin-top: 8px; }

</style>
</head>
<body>
<header class="bar">
  <svg viewBox="-2 -2 84 28" width="84" height="28" role="img" aria-label="APEX">
    <g fill="none" stroke="#F5F7FA" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M1 22 L9.5 2 L18 22"/><path d="M25 22 V2 H32 A5 5 0 0 1 32 12 H25"/>
      <path d="M55 2 H43 V22 H55 M43 12 H52"/><path d="M61 2 L77 22 M77 2 L61 22"/>
    </g>
    <path d="M3.5 16.5 L19 13" fill="none" stroke="#FF5A1F" stroke-width="2.25" stroke-linecap="square"/>
  </svg>
  <div class="seg" role="group" aria-label="Platform" data-key="platform">
    <button data-v="ios">iOS</button><button data-v="android">Android</button><button data-v="windows">Windows</button>
  </div>
  <div class="status" id="status" role="status"><i></i><span>Connecting…</span></div>
</header>

<div class="layout">
  <main class="stage">
    <h1 id="stage-title">Your widget</h1>
    <p class="hint" id="stage-hint"></p>
    <div class="sizes" id="sizes"></div>
    <div class="lockrow" id="lockrow"></div>
    <h2 class="gallery-h">All widgets</h2>
    <div class="gallery" id="gallery"></div>
  </main>

  <aside class="panel" aria-label="Customize">
    <div class="field">
      <span class="plbl">Widget</span>
      <div class="wlist" id="wlist"></div>
    </div>
    <div class="field">
      <label for="driver">Driver</label>
      <select id="driver"><option>Loading drivers…</option></select>
    </div>
    <div class="field"><span class="plbl">Information</span>
      <div class="seg" role="group" aria-label="Information density" data-key="density">
        <button data-v="minimal">Minimal</button><button data-v="standard">Standard</button><button data-v="detailed">Detailed</button>
      </div></div>
    <div class="field"><span class="plbl">Theme</span>
      <div class="seg" role="group" aria-label="Theme" data-key="theme">
        <button data-v="dark">Dark</button><button data-v="amoled">AMOLED</button><button data-v="light">Light</button>
      </div></div>
    <div class="field"><span class="plbl">Accent</span>
      <div class="seg" role="group" aria-label="Accent" data-key="accent">
        <button data-v="system">F1 red</button><button data-v="team">Team colour</button>
      </div></div>
    <div class="toggle"><span class="plbl t2" id="tc-label">Show team colors</span>
      <button class="switch" role="switch" id="teamColors" aria-labelledby="tc-label"></button></div>
    <div class="field"><span class="plbl">Situation</span>
      <select id="scenario" aria-describedby="scenario-note">
        <option value="now">Right now (live data)</option>
        <option value="lights">Lights out in 10 seconds</option>
        <option value="countdown">Countdown</option>
        <option value="live">Live race</option>
        <option value="quali">Live qualifying</option>
        <option value="results">Results</option>
        <option value="stale">Offline, cached data</option>
        <option value="unavailable">Live data unavailable</option>
        <option value="loading">Loading</option>
      </select>
      <p class="note" id="scenario-note">Situations other than "Right now" replay the last race's real classification to show each state.</p>
    </div>
  </aside>
</div>

<script src="widgets.js"></script>
<script>
"use strict";
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const S = Object.assign({ widget: "race", platform: "ios", driver: null, density: "standard", theme: "dark",
  accent: "system", teamColors: true, scenario: "now" }, store.get("apex.prefs") || {});
let snap = store.get("apex.snapshot"), replay = null, fetchedAt = snap ? Date.parse(snap.generated_at) : 0, failed = false;
let view = null, lightsAt = 0, sim = null;

const { WIDGETS, esc, ago, raceMode, stateOf } = APEX;
const opts = () => ({ platform: S.platform, theme: S.theme, accent: S.accent, density: S.density, teamColors: S.teamColors, snap, fetchedAt });
const widgetHTML = (id, z, v, now) => APEX.render(id, z, v, now, opts());

// ---------- scenario → view model ----------
function buildView(now) {
  if (S.scenario === "loading" || !snap) return { loading: true };
  const v = structuredClone(snap);
  v.stale = S.scenario === "stale" ? 124e3 : failed ? now - fetchedAt : 0;
  const race = v.race;
  const shift = (target, startIn) => {   // move the weekend so `target` starts at now + startIn
    if (!race) return;
    const t = race.sessions.find(s => s.type === target) || race.sessions.at(-1);
    const delta = now + startIn - Date.parse(t.starts_at);
    race.sessions.forEach(s => { s.starts_at = new Date(Date.parse(s.starts_at) + delta).toISOString();
                                 s.ends_at = new Date(Date.parse(s.ends_at) + delta).toISOString(); });
  };
  const sc = S.scenario;
  if (sc === "lights") shift("RACE", lightsAt - now);
  if (sc === "countdown") shift("RACE", (2 * 3600 + 14 * 60 + 32) * 1e3);
  if (sc === "live") shift("RACE", -(64 * 60e3));
  if (sc === "results") shift("RACE", -(150 * 60e3));
  if (sc === "quali") shift("QUALIFYING", -(42 * 60e3));
  if (sc === "unavailable") { shift("RACE", -(30 * 60e3)); v.live_unavailable = true; }
  if (race && sc !== "now" && sc !== "stale") {
    race.sessions.forEach(s => s.state = stateOf(s, now));
    const [mode, focus] = raceMode(race.sessions, now);
    v.mode = mode;
    v.next_session = race.sessions.find(s => Date.parse(s.ends_at) > now) || null;
    v.live = mode === "live" && sc !== "unavailable" ? simTiming(focus, now) : null;
    v.results = mode === "results" ? Object.assign(simTiming(focus, now), { final: true, lap: race.laps_total }) : null;
    if (mode === "results" && v.driver) v.driver.weekend = [{ session_type: "RACE", ...favResult(v.results) }];
    if (sc === "quali" && v.driver) v.driver.weekend = [];
  } else if (v.next_session) {
    // Real data: still flip Countdown → LIVE on the client at the boundary, no refresh needed (spec §8).
    v.next_session.state = stateOf(v.next_session, now);
    if (race) { race.sessions.forEach(s => s.state = stateOf(s, now)); const [m] = raceMode(race.sessions, now); if (m !== v.mode && !(m === "results" && !v.results)) v.mode = m; }
  }
  return v;
}
function favResult(t) { const r = t.rows.find(r => r.code === snap.driver?.code); return { position: r?.position ?? null, gap: r?.gap ?? null }; }

// Replays the last race's classification. Positions drift every few seconds to show motion.
function simTiming(session, now) {
  if (!replay) return null;
  const quali = session.type === "QUALIFYING" || session.type === "SPRINT_QUALIFYING";
  if (!sim || sim.quali !== quali) sim = { quali, order: replay.rows.map(r => r.code), lap: 42, last: now };
  if (S.scenario !== "results" && now - sim.last > 4000) {
    const i = 1 + Math.floor(Math.random() * Math.min(8, sim.order.length - 2));
    [sim.order[i], sim.order[i + 1]] = [sim.order[i + 1], sim.order[i]];
    sim.lap = Math.min((snap.race?.laps_total ?? 60), sim.lap + 1); sim.last = now;
  }
  const byCode = Object.fromEntries(replay.rows.map(r => [r.code, r]));
  const glyph = ["purple", "green", "yellow"];
  return { session_id: session.id, session_type: session.type, phase: quali ? "Q3" : null, lap: quali ? null : sim.lap,
    laps_total: quali ? null : snap.race?.laps_total, final: false, updated_at: new Date(now).toISOString(),
    rows: sim.order.map((code, i) => { const r = byCode[code];
      const gap = i === 0 ? null : quali ? `+${(0.061 * i + 0.013 * (i % 3)).toFixed(3)}` : `+${(1.7 * i + 0.31 * (i % 4)).toFixed(3)}`;
      return { ...r, position: i + 1, time: quali && i === 0 ? "1:29.184" : null, gap,
        in_pit: !quali && i === 6 && sim.lap % 9 < 2, sectors: [glyph[(i + 2) % 3], glyph[i % 3], glyph[(i + 1) % 3]] }; }) };
}

function render() {
  const now = Date.now();
  view = buildView(now);
  const sizes = document.getElementById("sizes");
  APEX.flip(sizes, () => {
    sizes.innerHTML = [["s", "Small"], ["m", "Medium"], ["l", "Large"]]
      .map(([z, n]) => `<div class="size-col">${widgetHTML(S.widget, z, view, now)}<span>${n}</span></div>`).join("");
  });
  const lr = document.getElementById("lockrow");
  const showLock = S.platform === "ios" && S.widget === "race" && !view.loading;
  lr.hidden = !showLock; if (showLock) lr.innerHTML = APEX.lock(view, now);
  const g = document.getElementById("gallery");
  APEX.flip(g, () => { g.innerHTML = WIDGETS.map(([id, name]) => `<button data-w="${id}" aria-current="${id === S.widget}">${widgetHTML(id, "m", view, now)}<span>${name}</span></button>`).join(""); });
  const w = WIDGETS.find(w => w[0] === S.widget);
  document.getElementById("stage-title").textContent = w[1];
  document.getElementById("stage-hint").textContent = view.loading ? "Loading the latest data…" : {
    race: `Shows whatever matters now. Currently: ${({ live: "live timing", results: "results", countdown: "countdown", next: "next session" })[view.mode]}.`,
    next: "What's next, and when.", countdown: "How long until lights out.", timing: "Who's leading, and by how much.",
    driver: "Your driver's season at a glance.", fav: "Changes with the weekend: live position, result, grid slot or title standing.",
    wdc: "The drivers' championship.", wcc: "The constructors' championship.", weekend: "Every session this weekend.",
  }[S.widget];
}

function renderStatus() {
  const el = document.getElementById("status");
  const age = Date.now() - fetchedAt;
  el.classList.toggle("bad", failed);
  el.querySelector("span").textContent = !snap ? "Connecting…" : failed ? `Offline · showing data from ${ago(age).toLowerCase()} ago` : `Data current · updated ${ago(age).toLowerCase()} ago`;
}

async function load() {
  try {
    const q = S.driver ? `?driver=${encodeURIComponent(S.driver)}` : "";
    const r = await fetch(`/api/widgets/snapshot${q}`);
    if (!r.ok) throw new Error(r.status);
    snap = await r.json(); fetchedAt = Date.now(); failed = false;
    store.set("apex.snapshot", snap);
    if (!replay && snap.race) {
      const prev = `${snap.race.season}-${snap.race.round - 1}-race`;
      const t = await fetch(`/api/session/${prev}/timing`); if (t.ok) replay = await t.json();
    }
  } catch { failed = true; }
  renderStatus(); render();
}

async function loadDrivers() {
  const sel = document.getElementById("driver");
  try {
    const list = await (await fetch("/api/standings/drivers")).json();
    sel.innerHTML = `<option value="">No favourite</option>` + list.map(d => `<option value="${esc(d.driver_id)}">${esc(d.name)}</option>`).join("");
    if (S.driver == null && list[0]) S.driver = list[0].driver_id;
    sel.value = S.driver ?? "";
  } catch { sel.innerHTML = `<option>Drivers unavailable offline</option>`; }
}

// ---------- controls ----------
function syncControls() {
  document.querySelectorAll(".seg[data-key]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", S[g.dataset.key] === b.dataset.v)));
  document.getElementById("teamColors").setAttribute("aria-checked", S.teamColors);
  document.getElementById("wlist").innerHTML = WIDGETS.map(([id, name, sub]) => `<button data-w="${id}" aria-pressed="${id === S.widget}"><span>${name}</span><small>${sub}</small></button>`).join("");
  document.getElementById("scenario").value = S.scenario;
}
function set(k, v) { S[k] = v; store.set("apex.prefs", { ...S, scenario: "now" }); syncControls(); render(); }
document.querySelectorAll(".seg[data-key]").forEach(g => g.addEventListener("click", e => { const b = e.target.closest("button"); if (b) set(g.dataset.key, b.dataset.v); }));
document.getElementById("teamColors").addEventListener("click", () => set("teamColors", !S.teamColors));
document.addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (b) { set("widget", b.dataset.w); if (b.closest(".gallery")) window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); } });
document.getElementById("driver").addEventListener("change", e => { S.driver = e.target.value; set("driver", S.driver); load(); });
document.getElementById("scenario").addEventListener("change", e => { sim = null; lightsAt = Date.now() + 10e3; set("scenario", e.target.value); });

APEX.retry = load;
syncControls(); render(); renderStatus();
loadDrivers().then(load);
setInterval(render, 1000);       // countdowns tick; Race Mode re-evaluates every second
setInterval(load, 30e3);         // matches the snapshot's server cache TTL
setInterval(renderStatus, 5e3);
</script>
</body>
</html>
