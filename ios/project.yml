# XcodeGen spec: `brew install xcodegen && xcodegen` → APEX.xcodeproj
name: APEX
options:
  bundleIdPrefix: club.apex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set yours
targets:
  APEX:
    type: application
    platform: iOS
    sources:
      - APEX
      - Shared
      - LiveActivities/RaceActivityAttributes.swift
      - path: Widgets                     # same views power the in-app preview
        excludes: [APEXWidgets.swift]
    info:
      path: APEX/Info.plist
      properties:
        CFBundleDisplayName: APEX
        NSSupportsLiveActivities: true
        APEXBaseURL: $(APEX_BASE_URL)
        UILaunchScreen: { UIColorName: "" }
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [club.apex.refresh]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [apex]
    entitlements:
      path: APEX/APEX.entitlements
      properties:
        com.apple.security.application-groups: [group.club.apex]
    settings:
      base:
        APEX_BASE_URL: https://api.apex.example
    dependencies:
      - target: APEXWidgets
  APEXWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared, LiveActivities]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: APEX
        APEXBaseURL: $(APEX_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/APEXWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.club.apex]
    settings:
      base:
        APEX_BASE_URL: https://api.apex.example
